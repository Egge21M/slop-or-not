<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  /><title>Codex Response probe</title>
  <style>
    body {
      font-family: system-ui;
      max-width: 36rem;
      margin: 2rem auto;
      padding: 1rem;
    }
    input,
    button {
      padding: 0.7rem;
      margin: 0.3rem;
    }
    article {
      border: 1px solid #aaa;
      padding: 1rem;
      margin: 1rem 0;
    }
  </style>
  <h1>Codex Response probe</h1>
  <label
    >Bearer credential
    <input id="credential" type="password" autocomplete="off" /></label
  ><button id="connect">Connect</button>
  <p id="status">Enter the probe credential.</p>
  <main id="questions"></main>
  <script>
    let token = "";
    let timer;
    async function api(path, body) {
      const response = await fetch(path, {
        method: body ? "POST" : "GET",
        headers: {
          Authorization: `Bearer ${token}`,
          ...(body ? { "Content-Type": "application/json" } : {}),
        },
        body: body ? JSON.stringify(body) : undefined,
      });
      if (!response.ok) throw Error(`HTTP ${response.status}`);
      return response.json();
    }
    async function refresh() {
      try {
        const questions = await api("/questions");
        document.querySelector("#status").textContent = "Connected";
        const container = document.querySelector("#questions");
        container.replaceChildren();
        for (const question of questions) {
          const card = document.createElement("article");
          card.dataset.questionId = question.questionId;
          const title = document.createElement("h2");
          title.textContent = question.wording;
          card.append(title);
          const detail = document.createElement("p");
          detail.textContent = `${question.questionId}: ${question.state}${question.response ? ` (${question.response})` : ""}`;
          card.append(detail);
          if (question.state === "pending") {
            for (const response of ["yes", "no"]) {
              const button = document.createElement("button");
              button.textContent = response;
              button.onclick = async () => {
                try {
                  await api("/answer", {
                    questionId: question.questionId,
                    response,
                  });
                  await refresh();
                } catch (error) {
                  document.querySelector("#status").textContent = error.message;
                }
              };
              card.append(button);
            }
          }
          container.append(card);
        }
      } catch (error) {
        document.querySelector("#status").textContent = error.message;
      }
    }
    document.querySelector("#connect").onclick = () => {
      token = document.querySelector("#credential").value;
      clearInterval(timer);
      refresh();
      timer = setInterval(refresh, 500);
    };
  </script>
</html>
