# Replace the private app name and PUBLIC_ORIGIN together before deployment.
app = "REPLACE_WITH_PRIVATE_APP_NAME"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = 10

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATABASE_PATH = "/data/slop.sqlite"
  PUBLIC_ORIGIN = "https://REPLACE_WITH_PRIVATE_APP_NAME.fly.dev"

[deploy]
  strategy = "rolling"
  max_unavailable = 1

[mounts]
  source = "slop_data"
  destination = "/data"
  initial_size = "1GB"
  scheduled_snapshots = false

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false

[http_service.http_options]
  idle_timeout = 600

[[http_service.checks]]
  grace_period = "20s"
  interval = "15s"
  timeout = "5s"
  method = "GET"
  protocol = "http"
  path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

[[restart]]
  policy = "always"
  processes = ["app"]
